            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .badge-theme-unit7 {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);

            margin-bottom: 10px;

        .unit-entry-desc {

            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;

            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;

            align-items: center;
            justify-content: center;
            gap: 8px;

            justify-content: space-between;
            padding: 16px 22px;
            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            background: rgba(15, 23, 42, 0.85);
            border-color: #334155 !important;

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .card-badge {
            font-size: 0.76rem;
            font-weight: 800;
            padding: 3px 10px;

            padding: 3px 8px;

            width: 100%;

            border: none;

            align-items: center;

        .admin-toggle-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;

        .toggle-unlock-btn { background: #059669; color: #fff; }
        .toggle-lock-btn { background: #dc2626; color: #fff; }

        footer {
            margin-top: 60px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.8;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 25px;
        }
        .admin-login-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #64748b;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .admin-login-btn:hover {
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* 비밀번호 입력 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;

        .modal-box {

            border: 1px solid rgba(56, 189, 248, 0.3);

        .modal-box h3 {
            color: #f8fafc;

        .modal-box p {
            color: #94a3b8;
            font-size: 0.88rem;

        .pw-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .pw-input-wrapper input {
            width: 100%;
            padding: 10px 42px 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;

        .modal-btn-group {

            border: none;
            transition: opacity 0.2s;
        }
        .modal-btn-confirm {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: #fff;
        }
        .modal-btn-cancel {
            background: #334155;
            color: #cbd5e1;
        }
        .modal-btn-group button:hover {
            opacity: 0.9;
        }

</head>

        <div class="modal-box">
            <h3 id="modalTitle">🔑 관리자 비밀번호 인증</h3>
            <p id="modalDesc">관리자 비밀번호를 입력해주세요.</p>
            
            <div class="pw-input-wrapper">
                <input type="password" id="modalPwInput" placeholder="비밀번호 입력" autocomplete="off">
                <button type="button" class="pw-toggle-btn" id="pwToggleBtn" onclick="togglePasswordVisibility()" title="비밀번호 표시/숨김">👁️</button>

                <button type="button" class="modal-btn-confirm" onclick="submitAuthModal()">확인</button>
            </div>

        // 로컬 저장소 로드/저장
        function loadLockState() {
            const saved = localStorage.getItem('science_lab_lock_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (const uKey in defaultCurriculum) {
                        if (parsed[uKey] !== undefined) {
                            defaultCurriculum[uKey].isLocked = parsed[uKey].isLocked;
                            if (parsed[uKey].lessons) {
                                defaultCurriculum[uKey].lessons.forEach(l => {
                                    if (parsed[uKey].lessons[l.id] !== undefined) {
                                        l.isLocked = parsed[uKey].lessons[l.id];
                                    }
                                });
                            }
                        }
                    }
                } catch(e) {}
            }
        }

        function saveLockState() {
            const dataToSave = {};
            for (const uKey in defaultCurriculum) {
                dataToSave[uKey] = {
                    isLocked: defaultCurriculum[uKey].isLocked,
                    lessons: {}
                };
                defaultCurriculum[uKey].lessons.forEach(l => {
                    dataToSave[uKey].lessons[l.id] = l.isLocked;
                });
            }
            localStorage.setItem('science_lab_lock_data', JSON.stringify(dataToSave));
        }

        // 비밀번호 입력 모달 로직
        function openAuthModal(title, desc, successCallback) {
            currentAuthCallback = successCallback;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;

            const input = document.getElementById('modalPwInput');
            input.value = '';
            input.type = 'password';
            document.getElementById('pwToggleBtn').innerText = '👁️';

            document.getElementById('passwordModal').style.display = 'flex';
            setTimeout(() => input.focus(), 50);
        }

        function closeAuthModal() {
            document.getElementById('passwordModal').style.display = 'none';
            currentAuthCallback = null;
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('modalPwInput');
            const btn = document.getElementById('pwToggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }

        function submitAuthModal() {
            const inputVal = document.getElementById('modalPwInput').value;
            if (inputVal.trim() === ADMIN_PASSWORD) {
                const cb = currentAuthCallback;
                closeAuthModal();
                if (cb) cb();
            } else {
                alert("❌ 비밀번호가 올바르지 않습니다.");
                document.getElementById('modalPwInput').value = '';
                document.getElementById('modalPwInput').focus();
            }
        }

        document.getElementById('modalPwInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitAuthModal();
            if (e.key === 'Escape') closeAuthModal();
        });

        // 관리자 인증 요청
        function requestAdminAuth() {
            if (isAdminMode) {
                toggleAdminMode(false);
                return;
            }
            openAuthModal(
                "🔑 교사용 관리자 모드",
                "관리자 비밀번호를 입력하면 원터치 잠금 제어 모드가 활성화됩니다.",
                () => {
                    alert("🔓 관리자 인증에 성공하였습니다! 이제 원터치로 잠금 상태를 변경할 수 있습니다.");
                    toggleAdminMode(true);
                }
            );
        }

        function toggleAdminMode(state) {
            isAdminMode = state;
            document.getElementById('adminModeBanner').style.display = state ? 'block' : 'none';
            document.getElementById('adminToggleFooterBtn').innerText = state ? '🔒 관리자 모드 끄기' : '⚙️ 교사용 관리자 모드';
            renderCurrentView();
        }

        function toggleUnitLock(unitKey, e) {
            e.stopPropagation();
            defaultCurriculum[unitKey].isLocked = !defaultCurriculum[unitKey].isLocked;
            saveLockState();
            renderUnitHub();
        }

        function toggleLessonLock(lessonId, e) {
            e.stopPropagation();
            const unit = defaultCurriculum[currentUnitKey];
            const lesson = unit.lessons.find(l => l.id === lessonId);
            if (lesson) {
                lesson.isLocked = !lesson.isLocked;
                saveLockState();
                renderLessonCards(unit);
            }
        }

        function renderUnitHub() {
            const grid = document.getElementById('unitEntryGrid');
            grid.innerHTML = '';

            for (const [key, unit] of Object.entries(defaultCurriculum)) {
                const card = document.createElement('div');
                const isLocked = unit.isLocked;
                card.className = `unit-entry-card ${unit.themeClass} ${isLocked ? 'is-locked' : ''}`;

                const badgeHtml = isLocked 
                    ? `<span class="unit-entry-badge badge-locked">🔒 잠김 (비공개)</span>`
                    : `<span class="unit-entry-badge ${unit.badgeClass}">${unit.title.split('.')[0]} · ${unit.lessons.length}개 차시</span>`;

                const btnText = isLocked ? `🔒 잠김 (학습 불가)` : `${unit.icon} ${unit.title} 학습관 입장하기 ➔`;

                const adminToggleHtml = isAdminMode ? `
                    <div class="admin-toggle-bar" style="display:flex;">
                        <span style="font-size:0.85rem; color:#cbd5e1;">단원 공개 상태: <b>${isLocked ? '🔒 잠김' : '🔓 공개중'}</b></span>
                        <button class="admin-toggle-btn ${isLocked ? 'toggle-unlock-btn' : 'toggle-lock-btn'}" onclick="toggleUnitLock('${key}', event)">
                            ${isLocked ? '🔓 잠금 풀기' : '🔒 단원 잠그기'}
                        </button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div>
                        <div class="unit-entry-header">
                            ${badgeHtml}
                            <div class="unit-entry-icon">${unit.icon}</div>
                        </div>
                        <h2 class="unit-entry-title">${unit.title}</h2>
                        <p class="unit-entry-desc">${unit.desc}</p>
                    </div>
                    <div>
                        <button class="unit-entry-btn">${btnText}</button>
                        ${adminToggleHtml}
                    </div>
                `;

                card.onclick = () => {
                    if (isLocked && !isAdminMode) {
                        openAuthModal(
                            `🔒 [단원 전체] 잠금 해제`,
                            `현재 비공개 상태입니다. 관리자 비밀번호를 입력해 입장할 수 있습니다.`,
                            () => enterUnit(key)
                        );
                    } else {
                        enterUnit(key);
                    }
                };

                grid.appendChild(card);
            }
        }

        function renderLessonCards(unit) {
            const container = document.getElementById('lessonCardContainer');
            container.innerHTML = '';

            unit.lessons.forEach(l => {
                const card = document.createElement('div');
                const isLocked = l.isLocked;
                card.className = `lesson-card ${unit.cardClass} ${isLocked ? 'is-locked' : ''}`;

                const tagElements = l.tags.map(t => `<span class="tag">${t}</span>`).join('');
                const badgeHtml = isLocked 
                    ? `<span class="card-badge badge-locked">🔒 잠김</span>`
                    : `<span class="card-badge ${unit.badgeClass}">${unit.title.split('.')[0]} ${l.chasi}</span>`;

                const btnHtml = isLocked
                    ? `<button class="launch-btn btn-locked">🔒 수업 준비 중 (잠김)</button>`
                    : `<button class="launch-btn ${unit.btnClass}">${l.chasi} 학습 시작하기 ➔</button>`;

                const adminToggleHtml = isAdminMode ? `
                    <div class="admin-toggle-bar" style="display:flex;">
                        <span style="font-size:0.83rem; color:#cbd5e1;">차시 상태: <b>${isLocked ? '🔒 잠김' : '🔓 공개'}</b></span>
                        <button class="admin-toggle-btn ${isLocked ? 'toggle-unlock-btn' : 'toggle-lock-btn'}" onclick="toggleLessonLock('${l.id}', event)">
                            ${isLocked ? '🔓 차시 풀기' : '🔒 차시 잠그기'}
                        </button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            ${badgeHtml}
                            <div class="lesson-icon">${isLocked ? '🔒' : unit.icon}</div>
                        </div>
                        <h2 class="lesson-title">${l.title}</h2>
                        <p class="lesson-desc">${l.desc}</p>
                        <div class="feature-tags">${tagElements}</div>
                    </div>
                    <div>
                        ${btnHtml}
                        ${adminToggleHtml}
                    </div>
                `;

                card.onclick = () => {
                    if (isLocked && !isAdminMode) {
                        openAuthModal(
                            `🔒 [${l.chasi}] 잠금 해제`,
                            `현재 비공개 상태입니다. 관리자 비밀번호를 입력해 이동할 수 있습니다.`,
                            () => { window.location.href = l.file; }
                        );
                    } else {
                        window.location.href = l.file;
                    }
                };

                container.appendChild(card);
            });
        }

        function enterUnit(unitKey) {
            currentUnitKey = unitKey;
            const unit = defaultCurriculum[unitKey];
            if (!unit) return;

            document.getElementById('unitHubView').style.display = 'none';
            document.getElementById('lessonView').style.display = 'block';

            document.getElementById('headerMainTitle').innerText = `${unit.icon} ${unit.title} 학습관`;
            document.getElementById('headerSubTitle').innerText = `${unit.title}의 차시별 인터랙티브 학습 프로그램 목록입니다.`;

            const navBar = document.getElementById('unitNavBar');
            navBar.className = `unit-navigation-bar ${unit.barThemeClass || ''}`;
            document.getElementById('unitStatusText').innerHTML = `<span class="${unit.statusClass}">현재 학습관: ${unit.title} (총 ${unit.lessons.length}개 차시)</span>`;

            const banner = document.getElementById('unitBannerBox');
            banner.className = `unit-banner ${unit.bannerClass}`;
            document.getElementById('unitBannerTitle').innerText = `📖 ${unit.title} 탐구 안내`;
            document.getElementById('unitBannerDesc').innerText = unit.desc;

            renderLessonCards(unit);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToHub() {
            currentUnitKey = null;
            document.getElementById('unitHubView').style.display = 'block';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('headerMainTitle').innerText = '🔬 중2 과학 디지털 탐구 포털';
            document.getElementById('headerSubTitle').innerText = '학습할 단원을 선택하면 해당 단원의 탐구 활동들만 집중해서 학습할 수 있습니다.';
            renderUnitHub();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCurrentView() {
            if (currentUnitKey) {
                renderLessonCards(defaultCurriculum[currentUnitKey]);
            } else {
                renderUnitHub();
            }
        }

        loadLockState();
        renderUnitHub();
    </script>
